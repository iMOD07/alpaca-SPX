name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Test SSH connection
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "Testing SSH to $SSH_USER@$SSH_HOST ..."
          ssh -v -o StrictHostKeyChecking=no -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "echo 'SSH OK'"

      - name: Deploy to EC2 using systemd
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            echo ">>> cd to app directory"
            cd /home/ubuntu/alpaca-SPX

            echo ">>> fetch latest code"
            git fetch origin main

            echo ">>> reset to latest commit"
            git reset --hard origin/main

            echo ">>> build jar with Maven"
            mvn clean package -DskipTests

            echo ">>> reload systemd (in case the .service file changed)"
            sudo systemctl daemon-reload

            echo ">>> restart SPX service"
            sudo systemctl restart spx

            echo ">>> check service status"
            sudo systemctl status spx --no-pager || true

            echo "Deployment completed."
          EOF
