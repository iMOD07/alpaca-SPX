name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Deploy to EC2
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            echo ">>> cd to app directory"
            cd /home/ubuntu/alpaca-SPX

            echo ">>> git pull origin main"
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Build with Maven"
            mvn clean package -DskipTests

            echo ">>> Stop old Java process if exists"
            PID=$(pgrep -f 'java .*SNAPSHOT.jar' || true)
            if [ -n "$PID" ]; then
              echo "Stopping PID $PID"
              kill $PID || true
              sleep 5
            fi

            echo ">>> Start new JAR in background"
            JAR_FILE=$(ls target/*SNAPSHOT.jar | head -n 1)
            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: No JAR file found in target/"
              exit 1
            fi

            nohup java -jar "$JAR_FILE" > app.log 2>&1 &

            echo "Deployment done. App should be running on port 8080."
          EOF
