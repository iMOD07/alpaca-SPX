============

# ========== Spring Config ==========
spring.config.import=optional:file:.env[.properties]
spring.application.name=SPX
spring.main.web-application-type=servlet

# ========== DataSource ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/alpaca_bot_spx
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.format_sql=false

# ========== Flyway ==========
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========== Server ==========
server.port=8080
server.shutdown=graceful

# ========== Actuator ==========
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ========== Logging ==========
logging.level.root=INFO
logging.level.com.mod98.alpaca=INFO
logging.level.it.tdlight=WARN
logging.level.org.hibernate.SQL=WARN

# ========== Telegram ==========
telegram.api-id=${TELEGRAM_API_ID}
telegram.api-hash=${TELEGRAM_API_HASH}
telegram.phone=${TELEGRAM_PHONE}
telegram.channel-telegram-id=${TELEGRAM_CHANNEL_ID:5005203628}
telegram.session-dir=${TD_SESSION_DIR:/tdlight-session}

# ========== IBKR ==========
ibkr.host=${IBKR_HOST:127.0.0.1}
ibkr.port=${IBKR_PORT:7497}
ibkr.client-id=${IBKR_CLIENT_ID:7}
ibkr.account=${IBKR_ACCOUNT:DU0960320}

# ========== Trading (CRITICAL ? verify all values for production) ==========
spx.trading.trading-enabled=${TRADING_ENABLED:true}
spx.trading.option-qty=${OPTION_QTY:1}
spx.trading.entry-min-offset=${ENTRY_MIN_OFFSET:0.00}
spx.trading.entry-max-offset=${ENTRY_MAX_OFFSET:0.30}
spx.trading.tp-offset=${TP_OFFSET:1.00}
spx.trading.sl-offset=${SL_OFFSET:1.00}
spx.trading.max-spread=${MAX_SPREAD:0.30}
spx.trading.max-slippage=${MAX_SLIPPAGE:0.15}
spx.trading.entry-fill-timeout=${ENTRY_FILL_TIMEOUT:15s}
spx.trading.prepare-validity=${PREPARE_VALIDITY:30m}
spx.trading.market-data-timeout=${MD_TIMEOUT:3s}
spx.trading.place-bracket-orders=${PLACE_BRACKET:true}
spx.trading.allow-multiple-deals=${ALLOW_MULTI:true}

# ========== OpenAI ==========
openai.apiKey=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.timeout-ms=${OPENAI_TIMEOUT:8000}

