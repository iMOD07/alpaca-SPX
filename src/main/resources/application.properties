spx.trading.trading-enabled=${TRADING_ENABLED:true}

# ??? ?????? ??? ????
spx.trading.option-qty=${OPTION_QTY:1}

# Range: ASK ?? [signal - min, signal + max] ? ????
# ????: signal=2.5, min=0.00, max=0.30 ? range = [2.50 .. 2.80]
spx.trading.entry-min-offset=${ENTRY_MIN_OFFSET:0.00}
spx.trading.entry-max-offset=${ENTRY_MAX_OFFSET:0.30}

# TP/SL ?????? ??? preparePrice (?????? ??????)
