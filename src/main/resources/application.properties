spring.application.name=SPX
server.port=8080
spring.main.web-application-type=servlet
# spring.main.web-application-type=none
# spring.datasource.hikari.initialization-fail-timeout=0

# Telegram
telegram.api-id=${TELEGRAM_API_ID}
telegram.api-hash=${TELEGRAM_API_HASH}
telegram.phone=${TELEGRAM_PHONE}
telegram.channel-telegram.id=${TELEGRAM_CHANNEL_ID}
telegram.session-dir=${TD_SESSION_DIR:./tdlight-session}
logging.level.it.tdlight=WARN

# OpenAI
openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/alpaca_bot_spx
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.encoding=UTF-8

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
