# ============================================================
# SPX Trading Bot ? Production Configuration
# ============================================================
# Sensitive values come from .env file (not committed to git)
# Default values use ${VAR:default} syntax ? override via env vars
# ============================================================

spring.config.import=optional:file:.env[.properties]
spring.application.name=SPX
spring.main.web-application-type=servlet

# ===================== Server =====================
server.port=8080
server.shutdown=graceful

# ===================== DataSource (PostgreSQL) =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/alpaca_bot_spx
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000

# ===================== JPA / Hibernate =====================
# 'validate' = ??? schema ??? ?? ????? ??? entities ? ?? ????? DB ????????.
# Schema migrations ??? ??? Flyway ??? (???? ?????? ??? production).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.encoding=UTF-8
spring.sql.init.mode=never

# ===================== Flyway (Schema Migrations) =====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================== Actuator (Health/Metrics) =====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===================== Logging =====================
logging.level.root=INFO
logging.level.com.mod98.alpaca=INFO
logging.level.it.tdlight=WARN
logging.level.org.hibernate.SQL=WARN

# ===================== Telegram (TDLight) =====================
telegram.api-id=${TELEGRAM_API_ID}
telegram.api-hash=${TELEGRAM_API_HASH}
telegram.phone=${TELEGRAM_PHONE}
# IMPORTANT: ???? ????? (super-group / channel)
telegram.channel-telegram-id=${TELEGRAM_CHANNEL_ID:-5005203628}
telegram.session-dir=${TD_SESSION_DIR:./tdlight-session}

# ===================== IBKR (TWS Paper / Live) =====================
# Paper: 7497 | Live: 7496 | Gateway Paper: 4002 | Gateway Live: 4001
ibkr.host=${IBKR_HOST:127.0.0.1}
ibkr.port=${IBKR_PORT:7497}
ibkr.client-id=${IBKR_CLIENT_ID:7}
ibkr.account=${IBKR_ACCOUNT:DU0960320}

# ===================== Trading (CRITICAL ? verify each value!) =====================
