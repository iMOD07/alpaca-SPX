# ============================================================
# SPX Trading Bot ? Production Configuration
# ============================================================
# Sensitive values come from .env file (not committed to git)
# Default values use ${VAR:default} syntax ? override via env vars
# ============================================================

spring.config.import=optional:file:.env[.properties]
spring.application.name=SPX
spring.main.web-application-type=servlet

# ===================== Server =====================
server.port=8080
server.shutdown=graceful

# ===================== DataSource (PostgreSQL) =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/SPX_bot_ibkr
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000

# ===================== JPA / Hibernate =====================
# 'validate' = The schema must match the entities ? it does not automatically modify the DB.
# Schema migrations are done via Flyway only (more secure for production).spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.encoding=UTF-8
spring.sql.init.mode=never

# ===================== Flyway (Schema Migrations) =====================
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=2
# spring.flyway.locations=classpath:db/migration

# ===================== Actuator (Health/Metrics) =====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===================== Logging =====================
logging.level.root=INFO
logging.level.com.mod98.alpaca=INFO
logging.level.it.tdlight=WARN
logging.level.org.hibernate.SQL=WARN

# ===================== Telegram (TDLight) =====================
telegram.api-id=${TELEGRAM_API_ID}
telegram.api-hash=${TELEGRAM_API_HASH}
telegram.phone=${TELEGRAM_PHONE}
telegram.channel-telegram-id=-1003970356976
telegram.session-dir=${TD_SESSION_DIR:./tdlight-session}

# ===================== IBKR (TWS Paper / Live) =====================
# Paper: 7497 | Live: 7496 | Gateway Paper: 4002 | Gateway Live: 4001
ibkr.host=${IBKR_HOST:127.0.0.1}
ibkr.port=${IBKR_PORT:7497}
ibkr.client-id=${IBKR_CLIENT_ID:7}
ibkr.account=${IBKR_ACCOUNT:DUO960320}
ibkr.market-data.delayed-fallback=true

# ===================== Trading (CRITICAL verify each value!) =====================
# kill-switch: false = The bot receives and records messages but does not execute trades
spx.trading.trading-enabled=${TRADING_ENABLED:true}

# Number of contracts per transaction
spx.trading.option-qty=${OPTION_QTY:1}

# Range: ASK in [signal - min, signal + max]  Accept
# Example: signal=2.5, min=0.00, max=0.30  range = [2.50 .. 2.80]
spx.trading.entry-min-offset=${ENTRY_MIN_OFFSET:0.00}
spx.trading.entry-max-offset=${ENTRY_MAX_OFFSET:0.30}

# TP/SL calculated on preparePrice (golden logic)
# Example: signal=2.5, tp-offset=1.00, sl-offset=1.00  TP=3.50, SL=1.50
spx.trading.tp-offset=${TP_OFFSET:1.00}
spx.trading.sl-offset=${SL_OFFSET:1.00}

# Risk gates (prevent implementation under unsuitable conditions)
#spx.trading.max-spread=${MAX_SPREAD:0.30}
#spx.trading.max-slippage=${MAX_SLIPPAGE:0.15}
spx.trading.max-spread=${MAX_SPREAD:0.30}
spx.trading.max-slippage=${MAX_SLIPPAGE:0.15}

# Timeouts
spx.trading.entry-fill-timeout=${ENTRY_FILL_TIMEOUT:15s}
spx.trading.prepare-validity=${PREPARE_VALIDITY:30m}
spx.trading.market-data-timeout=${MD_TIMEOUT:7s}

# Auto-place TP/SL bracket after ENTRY filled
spx.trading.place-bracket-orders=${PLACE_BRACKET:true}

# Allow multiple parallel deals (must be false if you only want one deal)
spx.trading.allow-multiple-deals=${ALLOW_MULTI:true}

# ===================== OpenAI =====================
openai.apiKey=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.timeout-ms=${OPENAI_TIMEOUT:8000}
