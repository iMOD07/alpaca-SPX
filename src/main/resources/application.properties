# ============================================================
# SPX Trading Bot Production Configuration v3.1
# ============================================================
# Sensitive values come from .env file (not committed to git).
# Default values use ${VAR:default} syntax  override via env vars.
# ============================================================

spring.config.import=optional:file:.env[.properties]
spring.application.name=SPX
spring.main.web-application-type=servlet

# ===================== Server =====================
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===================== DataSource (PostgreSQL) =====================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:SPX_bot_ibkr}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.encoding=UTF-8
spring.sql.init.mode=never

# ===================== Flyway (disabled  schema managed via create_database.sql) =====================
spring.flyway.enabled=false

# ===================== Actuator =====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===================== Logging =====================
logging.level.root=INFO
logging.level.com.mod98.alpaca=INFO
logging.level.it.tdlight=WARN
logging.level.org.hibernate.SQL=WARN

# ===================== Telegram (TDLight) =====================
telegram.api-id=${TELEGRAM_API_ID}
telegram.api-hash=${TELEGRAM_API_HASH}
telegram.phone=${TELEGRAM_PHONE}
telegram.channel-telegram-id=${TELEGRAM_CHANNEL_ID}
telegram.session-dir=${TD_SESSION_DIR:./tdlight-session}

# ===================== IBKR (TWS / Gateway) =====================
ibkr.host=${IBKR_HOST:127.0.0.1}

# Test
ibkr.port=${IBKR_PORT:4002}
# Live
#ibkr.port=${IBKR_PORT:7497}

ibkr.client-id=${IBKR_CLIENT_ID:7}
ibkr.account=${IBKR_ACCOUNT:DUO960320}
ibkr.market-data.delayed-fallback=${IBKR_MARKET_DATA_DELAYED_FALLBACK:false}

# ===================== Trading =====================
# Kill switch false = receive messages but don't execute
spx.trading.trading-enabled=${TRADING_ENABLED:true}

# Contracts per trade
spx.trading.option-qty=${OPTION_QTY:1}

# Entry price range: [signal - min, signal + max]
spx.trading.entry-min-offset=${ENTRY_MIN_OFFSET:0.30}
spx.trading.entry-max-offset=${ENTRY_MAX_OFFSET:0.30}

# TP/SL = entry ± $1.00 (target $100 profit/loss per contract)
spx.trading.tp-offset=${TP_OFFSET:1.00}
spx.trading.sl-offset=${SL_OFFSET:1.00}

# ? NEW v3.2: STP-LMT floor below SL trigger
# Example: SL=2.90, sl-lmt-offset=0.50 ? LMT floor=2.40
# If gap-down below 2.40 ? order pending (manual intervention)
spx.trading.sl-lmt-offset=${SL_LMT_OFFSET:0.50}

# Risk gates (block entry under unsuitable conditions)
spx.trading.max-spread=${MAX_SPREAD:0.30}
spx.trading.max-slippage=${MAX_SLIPPAGE:0.15}

# Timeouts
spx.trading.entry-fill-timeout=${ENTRY_FILL_TIMEOUT:15s}
spx.trading.market-data-timeout=${MD_TIMEOUT:7s}

# Auto-place TP/SL bracket after ENTRY filled
spx.trading.place-bracket-orders=${PLACE_BRACKET:true}

# ? NEW v3.2: Bracket retry on failure
spx.trading.bracket-retry-max=${BRACKET_RETRY_MAX:3}
spx.trading.bracket-retry-delay=${BRACKET_RETRY_DELAY:2s}


# Allow multiple parallel deals (CALL + PUT simultaneously)
spx.trading.allow-multiple-deals=${ALLOW_MULTIPLE_DEALS:true}

# NEW v3.1: Daily kill switch — stop after N consecutive losses
# Counter resets to 0 on any win.
spx.trading.max-consecutive-losses=${MAX_CONSECUTIVE_LOSSES:4}



# ? NEW v3.2: Concurrent deals limit
spx.trading.max-concurrent-deals=${MAX_CONCURRENT_DEALS:3}

# ? NEW v3.2: Buying power pre-flight check
spx.trading.buying-power-check-enabled=${BUYING_POWER_CHECK:true}
spx.trading.buying-power-buffer=${BUYING_POWER_BUFFER:100}


